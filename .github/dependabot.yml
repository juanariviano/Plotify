# pull request mingguan untuk update dependency; patch & minor digabung jadi satu PR per folder
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /PlotifyBackend
      - /PlotifyFrontend
      - /PlotifyExtension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
